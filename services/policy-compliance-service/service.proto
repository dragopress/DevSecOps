syntax = "proto3";

package devsecops.compliance.v1;

option go_package = "github.com/secops/policy-compliance-service/gen/v1;compliancev1";

service PolicyComplianceService {
  rpc EvaluateRegoPolicy (EvaluatePolicyRequest) returns (EvaluatePolicyResponse);
  rpc RunCisBenchmarkScan (CisBenchmarkRequest) returns (CisBenchmarkResponse);
}

message EvaluatePolicyRequest {
  string policy_rego = 1;
  string input_json = 2;
}

message EvaluatePolicyResponse {
  bool allow = 1;
  repeated string violations = 2;
  int32 evaluation_duration_ms = 3;
}

message CisBenchmarkRequest {
  string cloud_provider = 1; // "aws", "gcp", "azure"
  string benchmark_version = 2; // "CIS AWS Foundations v3.0"
}

message CisBenchmarkResponse {
  int32 total_controls = 1;
  int32 passed_controls = 2;
  int32 failed_controls = 3;
  double compliance_score_percentage = 4;
  repeated CisControlStatus controls = 5;
}

message CisControlStatus {
  string control_id = 1;
  string title = 2;
  string category = 3;
  string status = 4; // "PASSED", "FAILED"
  string severity = 5;
  string remediation_guidance = 6;
}
